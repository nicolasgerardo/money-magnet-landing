<!-- 2) MODAL de contrato + firma (pega una sola vez, antes de </body>) -->
<div id="modal-contrato" style="display:none;position:fixed;inset:0;background:rgba(11,17,49,0.75);z-index:9999;overflow-y:auto;padding:24px;">
  <div style="max-width:760px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.4);">
    <!-- Header marca Intrade -->
    <div style="background:#0B1131;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="color:#F5B800;font-weight:800;font-size:18px;letter-spacing:.5px;">ACADEMIA INTRADE</div>
        <div style="color:#fff;font-size:13px;opacity:.8;">Contrato de Comisión Mercantil — Titanes</div>
      </div>
      <button onclick="cerrarContrato()" style="background:none;border:none;color:#fff;font-size:26px;cursor:pointer;line-height:1;">&times;</button>
    </div>

    <div id="contrato-body" style="padding:28px;max-height:62vh;overflow-y:auto;color:#1f2433;font-size:14px;line-height:1.6;">
      <div style="color:#6B7280;">Cargando contrato…</div>
    </div>

    <!-- Footer firma -->
    <div id="contrato-firma" style="border-top:1px solid #e5e7eb;padding:22px 28px;background:#f8fafc;display:none;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
        <div>
          <label style="font-size:12px;font-weight:700;color:#0B1131;">Nombre completo (firma)</label>
          <input id="firma-nombre" type="text" placeholder="Tu nombre completo"
            style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;margin-top:4px;font-size:14px;">
        </div>
        <div>
          <label style="font-size:12px;font-weight:700;color:#0B1131;">Cédula de ciudadanía</label>
          <input id="firma-cedula" type="text" placeholder="Sin puntos"
            style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;margin-top:4px;font-size:14px;">
        </div>
      </div>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#374151;cursor:pointer;margin-bottom:8px;">
        <input id="firma-acepto" type="checkbox" style="margin-top:3px;width:18px;height:18px;">
        <span>He leído y acepto íntegramente el contrato, el Código de Honor y la Política de Tratamiento de Datos de Academia Intrade. Entiendo que mi firma electrónica, junto con mi IP y dispositivo, queda registrada como prueba de mi aceptación.</span>
      </label>
      <div id="firma-evidencia" style="font-size:11px;color:#6B7280;background:#eef2f7;border-radius:8px;padding:10px 12px;margin-bottom:14px;">
        Al firmar se registrará: IP, navegador y dispositivo, fecha y hora exactas, y una huella digital única (hash) del contrato.
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;align-items:center;">
        <span id="firma-msg" style="font-size:13px;color:#dc2626;margin-right:auto;"></span>
        <button onclick="cerrarContrato()" style="background:#fff;border:1px solid #d1d5db;color:#374151;padding:11px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Cancelar</button>
        <button id="firma-btn" onclick="firmarContrato()" style="background:#F5B800;border:none;color:#0B1131;padding:11px 22px;border-radius:8px;font-weight:800;cursor:pointer;">Firmar contrato</button>
      </div>
    </div>

    <!-- Comprobante post-firma -->
    <div id="contrato-comprobante" style="display:none;padding:32px 28px;text-align:center;">
      <div style="font-size:46px;margin-bottom:8px;">✅</div>
      <h3 style="color:#0B1131;margin:0 0 6px;">Contrato firmado</h3>
      <p style="color:#6B7280;font-size:14px;margin:0 0 18px;">Tu firma quedó registrada. Conserva este comprobante.</p>
      <div id="comprobante-datos" style="text-align:left;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:16px;font-size:13px;color:#374151;line-height:1.8;"></div>
      <button onclick="cerrarContrato()" style="margin-top:20px;background:#0B1131;border:none;color:#fff;padding:11px 26px;border-radius:8px;font-weight:700;cursor:pointer;">Cerrar</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// Generador de contrato + firma digital
// ============================================================
var _contratoActual = null;

// Captura la IP pública del firmante (servicio gratuito sin key).
// Si falla, se firma igual y el backend registra 'no-capturada'.
async function _obtenerIP() {
  try {
    var r = await fetch('https://api.ipify.org?format=json');
    var j = await r.json();
    return j.ip || 'no-capturada';
  } catch (e) { return 'no-capturada'; }
}

window.abrirContrato = function (titanId) {
  var modal = document.getElementById('modal-contrato');
  modal.style.display = 'block';
  document.getElementById('contrato-firma').style.display = 'none';
  document.getElementById('contrato-comprobante').style.display = 'none';
  document.getElementById('contrato-body').style.display = 'block';
  document.getElementById('contrato-body').innerHTML = '<div style="color:#6B7280;">Cargando contrato…</div>';
  document.getElementById('firma-msg').textContent = '';

  apiGet('crm_contrato_preview', { titan_id: titanId }).then(function (res) {
    if (!res || !res.ok) {
      document.getElementById('contrato-body').innerHTML = '<div style="color:#dc2626;">No se pudo cargar: ' + escapeHtml((res && res.error) || 'error') + '</div>';
      return;
    }
    _contratoActual = res.data;
    var aviso = '';
    if (res.data.modoBorrador) {
      aviso = '<div style="background:#fff8e6;border:1px solid #F5B800;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#8A6D00;">' +
        '<b>📝 Versión en validación.</b> Este contrato es un borrador provisional mientras se completa la revisión legal y el registro de la empresa. Tu aceptación queda registrada, y se te pedirá firmar la versión definitiva cuando esté lista.' +
        '</div>';
    }
    document.getElementById('contrato-body').innerHTML = aviso + _renderContrato(res.data);
    document.getElementById('contrato-firma').style.display = 'block';
  });
};

function _renderContrato(d) {
  var t = d.titan, r = d.rango, e = d.empresa;
  function clausula(n, txt) {
    return '<p style="margin:12px 0;"><b style="color:#0B1131;">' + n + '.</b> ' + txt + '</p>';
  }
  return '' +
    '<div style="text-align:center;margin-bottom:14px;"><b style="font-size:16px;color:#0B1131;">CONTRATO DE COMISIÓN MERCANTIL</b></div>' +
    '<p>Entre <b>' + escapeHtml(e.razonSocial) + '</b> (NIT ' + escapeHtml(e.nit) + '), con domicilio en ' + escapeHtml(e.ciudad) + ', representada legalmente por ' + escapeHtml(e.repLegalNombre) + ', en adelante <b>LA EMPRESA</b>; y <b>' + escapeHtml(t.nombre) + '</b>, identificado(a) con C.C. No. ' + escapeHtml(t.cedula || '____________') + ', correo ' + escapeHtml(t.email) + ', en adelante <b>EL COMISIONISTA (Titán)</b>; se celebra el presente contrato regido por el Código de Comercio colombiano (arts. 1287 y ss.).</p>' +
    '<div style="background:#eef2f7;border-radius:10px;padding:14px;margin:14px 0;">' +
      '<b style="color:#0B1131;">Rango asignado: ' + escapeHtml(r.nombre || '—') + '</b><br>' +
      'Comisión por evento: <b>' + r.pct_evento + '%</b> · Por cierre de Intrader: <b>' + r.pct_intrader + '%</b> · Para quien confirmó el lead: <b>' + r.pct_confirmador + '%</b>' +
    '</div>' +
    clausula('PRIMERA — Objeto', 'EL COMISIONISTA promueve y concreta, por su cuenta y riesgo, la venta de los productos y servicios educativos de Academia Intrade (cursos de negocios, Airbnb, finanzas, trading e inversión, mentorías, membresías y eventos), sin representación ni facultad de obligar a LA EMPRESA frente a terceros.') +
    clausula('SEGUNDA — Naturaleza independiente', 'Contrato estrictamente mercantil. No genera relación laboral ni subordinación. EL COMISIONISTA actúa con autonomía, sus propios medios y horarios, sin salario ni prestaciones; su única contraprestación es la comisión. Asume su seguridad social y obligaciones tributarias.') +
    clausula('TERCERA — Comisión', 'Se causa y paga solo cuando la venta se concreta, el cliente paga en su totalidad y LA EMPRESA recibe los recursos, sobre el valor neto recibido, según el rango indicado y la Tabla de Comisiones vigente.') +
    clausula('CUARTA — Pago', 'Liquidación mensual; EL COMISIONISTA expide cuenta de cobro o factura electrónica (DIAN). Pago en COP o el medio que LAS PARTES acuerden por escrito.') +
    clausula('QUINTA — Confidencialidad (4 años)', 'EL COMISIONISTA guarda confidencialidad sobre la metodología, materiales, datos de clientes y todo el contenido del CRM, durante el contrato y por 4 años tras su terminación.') +
    clausula('SEXTA — Exclusividad y no competencia', 'Durante el contrato no promueve productos iguales o similares de terceros. Terminado el contrato, no usa ni replica la metodología, materiales ni la base de datos de Academia Intrade.') +
    clausula('SÉPTIMA — Protección de datos', 'Trata los datos de clientes conforme a la Ley 1581 de 2012, solo para los fines del contrato, y mantiene indemne a LA EMPRESA.') +
    clausula('OCTAVA — Deslinde', 'LA EMPRESA no responde por las actuaciones de EL COMISIONISTA frente a clientes o terceros; este lo mantiene indemne.') +
    clausula('NOVENA — Terminación', 'Duración indefinida; cualquiera la termina con preaviso escrito de 30 días. Causales inmediatas: violar confidencialidad/exclusividad/datos, cobrar a clientes, informes falsos, uso indebido de marca, entre otras.') +
    clausula('DÉCIMA — Ley aplicable', 'Leyes de Colombia; controversias ante los jueces de ' + escapeHtml(e.ciudad) + ', previo arreglo directo.') +
    '<p style="margin-top:14px;color:#6B7280;font-size:12px;">Versión del clausulado: ' + escapeHtml(d.version) + '. Este resumen es vinculante junto con el contrato completo, el Código de Honor y la Política de Datos, que EL COMISIONISTA declara conocer y aceptar.</p>';
}

window.firmarContrato = async function () {
  var msg = document.getElementById('firma-msg');
  msg.style.color = '#dc2626';
  var nombre = document.getElementById('firma-nombre').value.trim();
  var cedula = document.getElementById('firma-cedula').value.trim();
  var acepto = document.getElementById('firma-acepto').checked;
  if (!nombre || !cedula) { msg.textContent = 'Escribe tu nombre y cédula.'; return; }
  if (!acepto) { msg.textContent = 'Debes marcar la casilla de aceptación.'; return; }

  var btn = document.getElementById('firma-btn');
  btn.disabled = true; btn.textContent = 'Firmando…';
  msg.style.color = '#6B7280'; msg.textContent = 'Capturando evidencia…';

  var ip = await _obtenerIP();
  apiGet('crm_contrato_firmar', {
    titan_id: _contratoActual.titan.titan_id,
    firma_nombre: nombre,
    firma_cedula: cedula,
    acepto: true,
    ip: ip,
    user_agent: navigator.userAgent
  }).then(function (res) {
    btn.disabled = false; btn.textContent = 'Firmar contrato';
    if (!res || !res.ok) { msg.style.color = '#dc2626'; msg.textContent = (res && res.error) || 'Error al firmar'; return; }
    var d = res.data;
    document.getElementById('contrato-body').style.display = 'none';
    document.getElementById('contrato-firma').style.display = 'none';
    var badge = d.esBorrador
      ? '<div style="background:#fff8e6;border:1px solid #F5B800;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#8A6D00;"><b>Estado:</b> BORRADOR EN VALIDACIÓN — se re-firmará la versión final.</div>'
      : '';
    document.getElementById('comprobante-datos').innerHTML = badge +
      '<b>ID del contrato:</b> ' + escapeHtml(d.contrato_id) + '<br>' +
      '<b>Fecha y hora:</b> ' + escapeHtml(d.fecha) + '<br>' +
      '<b>Dispositivo:</b> ' + escapeHtml(d.dispositivo) + '<br>' +
      '<b>IP:</b> ' + escapeHtml(d.ip) + '<br>' +
      '<b>Huella (hash):</b> <span style="word-break:break-all;font-family:monospace;font-size:11px;">' + escapeHtml(d.hash) + '</span>';
    document.getElementById('contrato-comprobante').style.display = 'block';
  });
};

window.cerrarContrato = function () {
  document.getElementById('modal-contrato').style.display = 'none';
  _contratoActual = null;
};
</script>
