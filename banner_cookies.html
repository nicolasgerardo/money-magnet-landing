<!-- ============================================================
     BANNER DE COOKIES — Academia Intrade
     Pega este bloque completo justo antes de </body> en tu sitio.
     Es autónomo: no depende de librerías ni frameworks.
     Guarda la decisión del usuario en su navegador (localStorage)
     y no vuelve a aparecer hasta que la borre o cambie de opinión.
     ============================================================ -->
<div id="intrade-cookies" style="
  display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;
  max-width:560px;margin:0 auto;background:#0B1131;color:#fff;border-radius:16px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);padding:20px 22px;
  font-family:'Poppins',system-ui,sans-serif;border:1px solid rgba(245,184,0,.25);">
  <div style="display:flex;gap:12px;align-items:flex-start;">
    <div style="font-size:22px;line-height:1;">🍪</div>
    <div style="flex:1;">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;">Usamos cookies</div>
      <p style="font-size:13px;line-height:1.55;color:#cfd3e6;margin:0 0 14px;">
        Utilizamos cookies necesarias para que el sitio funcione y, con tu permiso,
        cookies de preferencias y analíticas para mejorar tu experiencia. Puedes aceptar
        todas, solo las necesarias, o conocer más en nuestra
        <a href="/legal" style="color:#F5B800;text-decoration:underline;">información legal</a>.
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button onclick="intradeCookies(true)" style="
          background:#F5B800;color:#0B1131;border:none;font-weight:800;font-family:inherit;
          padding:10px 18px;border-radius:9px;cursor:pointer;font-size:13px;">Aceptar todas</button>
        <button onclick="intradeCookies(false)" style="
          background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);font-weight:600;
          font-family:inherit;padding:10px 18px;border-radius:9px;cursor:pointer;font-size:13px;">Solo necesarias</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  try {
    var saved = localStorage.getItem('intrade_cookie_consent');
    if (!saved) document.getElementById('intrade-cookies').style.display = 'block';
  } catch(e) {
    // Si el navegador bloquea localStorage, mostramos el banner igual.
    document.getElementById('intrade-cookies').style.display = 'block';
  }
  window.intradeCookies = function(aceptaTodas){
    try {
      localStorage.setItem('intrade_cookie_consent', JSON.stringify({
        nivel: aceptaTodas ? 'todas' : 'necesarias',
        fecha: new Date().toISOString()
      }));
    } catch(e){}
    document.getElementById('intrade-cookies').style.display = 'none';
    // Si aceptó todas, aquí puedes activar tu analítica.
    // Ejemplo: if (aceptaTodas) { cargarAnalitica(); }
  };
})();
</script>
